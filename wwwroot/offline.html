<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0f0c1a" />
<title>AiPulse · Offline</title>
<style>
  :root { color-scheme: light dark; --bg: #faf9ff; --fg: #14232a; --muted: #4a5d66; --accent: #0b7f8a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f0c1a; --fg: #e6f0f2; --muted: #9db1b8; --accent: #3cc7d4; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; text-align: center; }
  main { max-width: 26rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: var(--muted); line-height: 1.5; }
  button { min-height: 2.75rem; padding: 0 1.25rem; border: 0; border-radius: .5rem; background: var(--accent); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>AiPulse needs a connection to load the latest news. Check your network, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
